<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRUENO - TURR4ZO WORLD TOUR | Playlist</title>
    <!-- Tipografías oficiales -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <!-- Hoja de estilos externa -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Tarjeta principal estilo póster -->
    <main class="poster-card">

        <!-- Encabezado del Tour -->
        <header class="poster-header">
            <h1 class="poster-title">TRUENO</h1>
            <p class="poster-subtitle">TURR4ZO WORLD TOUR</p>
        </header>

        <!-- Layout: Columnas de Setlist + Foto central -->
        <div class="setlist-container">

            <!-- Columna Izquierda (1 a 15) -->
            <section class="setlist-col">
                <h2 class="col-heading">SETLIST</h2>
                <div id="col-left" class="track-list"></div>
            </section>

            <!-- Imagen Central Trueno -->
            <div class="artist-stage">
                <img src="trueno_card.jpg" alt="Trueno Turrazo Tour" class="artist-image">
            </div>

            <!-- Columna Derecha (16 a 29) -->
            <section class="setlist-col">
                <div class="heading-spacer"></div>
                <div id="col-right" class="track-list"></div>
            </section>

        </div>

        <!-- Crédito inferior -->
        <footer class="poster-footer">
            @truenodata
        </footer>
    </main>

    <!-- Mini Reproductor Flotante Inferior -->
    <aside class="floating-player">
        <div class="player-info">
            <div id="player-track-num" class="player-badge">4</div>
            <div class="player-meta">
                <p id="player-track-title" class="player-title">REAL GANGSTA LOVE</p>
                <p class="player-sub">Trueno • Turr4zo World Tour</p>
            </div>
        </div>

        <!-- Controles -->
        <div class="player-controls">
            <button id="btn-prev" class="btn-nav" title="Anterior">
                <svg viewBox="0 0 24 24">
                    <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z" />
                </svg>
            </button>

            <a id="btn-yt-play" href="https://www.youtube.com/watch?v=FCMtx6IRyYY" target="_blank" class="btn-play"
                title="Reproducir en YouTube">
                ▶
            </a>

            <button id="btn-next" class="btn-nav" title="Siguiente">
                <svg viewBox="0 0 24 24">
                    <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z" />
                </svg>
            </button>
        </div>
    </aside>

    <!-- Lógica en JavaScript externo -->
    <script src="app.js"></script>
</body>

</html>
