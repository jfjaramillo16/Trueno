<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRUENO | Turr4zo World Tour</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Contenedor Principal / Poster -->
    <main class="poster-card">

        <!-- Encabezado del Tour -->
        <header class="poster-header">
            <h1 class="poster-title">TRUENO</h1>
            <p class="poster-subtitle">TURR4ZO WORLD TOUR</p>
        </header>

        <!-- Setlist -->
        <div class="setlist-container">

            <!-- Columna Izquierda (1-15) -->
            <section class="setlist-col left-col">
                <h2 class="col-heading">SETLIST</h2>
                <div id="col-left" class="track-list"></div>
            </section>

            <!-- Imagen Central de Trueno -->
            <div class="artist-stage">
                <img src="trueno_card.jpg" alt="Trueno" class="artist-image">
            </div>

            <!-- Columna Derecha (16-29) -->
            <section class="setlist-col right-col">
                <div class="heading-spacer"></div>
                <div id="col-right" class="track-list"></div>
            </section>

        </div>

        <!-- Pie del poster -->
        <footer class="poster-footer">
            <span>@truenodata</span>
        </footer>
    </main>

    <!-- Modal / Mini Player de YouTube Flotante -->
    <div id="video-modal" class="video-modal hidden">
        <div class="video-modal-content">
            <div class="modal-top">
                <div class="modal-info">
                    <span id="modal-track-num" class="badge">04</span>
                    <div>
                        <h3 id="modal-track-title">REAL GANGSTA LOVE</h3>
                        <span class="live-tag">OFICIAL EN YOUTUBE</span>
                    </div>
                </div>
                <div class="modal-actions">
                    <a id="btn-external-yt" href="#" target="_blank" rel="noopener noreferrer" class="btn-yt-icon"
                        title="Abrir en YouTube">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                            <path
                                d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z" />
                        </svg>
                    </a>
                    <button id="close-modal" class="btn-close" title="Cerrar">&times;</button>
                </div>
            </div>

            <!-- Marco Iframe de YouTube -->
            <div class="video-responsive">
                <iframe id="yt-iframe" src="" frameborder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                    allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
