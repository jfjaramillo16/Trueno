<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRUENO - TURR4ZO WORLD TOUR | Playlist</title>
    <!-- Tailwind CSS que hacía que se viera perfecto -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;800&display=swap"
        rel="stylesheet">
    <style>
        .font-trueno {
            font-family: 'Anton', sans-serif;
            letter-spacing: 1px;
        }

        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: #404040;
            border-radius: 4px;
        }

        .equalizer-bar {
            display: inline-block;
            width: 3px;
            height: 12px;
            background-color: #facc15;
            margin-left: 2px;
            animation: bounce 0.6s infinite alternate ease-in-out;
        }

        .equalizer-bar:nth-child(2) {
            animation-delay: 0.2s;
        }

        .equalizer-bar:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {
            from {
                height: 3px;
            }

            to {
                height: 14px;
            }
        }
    </style>
</head>

<body
    class="bg-black text-neutral-200 min-h-screen flex flex-col items-center justify-center p-3 md:p-8 font-sans select-none pb-28">

    <!-- Tarjeta principal del concierto -->
    <main
        class="relative w-full max-w-4xl bg-gradient-to-b from-[#3a3a3a] via-[#242424] to-[#121212] rounded-3xl p-6 md:p-10 shadow-[0_20px_60px_rgba(0,0,0,0.9)] border border-neutral-700/40 overflow-hidden">

        <!-- Encabezado del Tour -->
        <header class="text-center z-20 relative mb-6">
            <h1
                class="font-trueno text-7xl md:text-9xl tracking-tight text-[#e5e5e5] uppercase drop-shadow-[0_10px_20px_rgba(0,0,0,0.8)]">
                TRUENO
            </h1>
            <p class="text-xs md:text-sm tracking-[0.45em] text-neutral-400 font-bold uppercase -mt-2 md:-mt-4">
                TURR4ZO WORLD TOUR
            </p>
        </header>

        <!-- Layout: Columnas interactivas + Foto central -->
        <div class="relative flex flex-col md:flex-row justify-between items-stretch min-h-[560px]">

            <!-- Columna Izquierda: 1 a 15 -->
            <section class="w-full md:w-[35%] z-20 space-y-1 mb-6 md:mb-0">
                <h2
                    class="text-xs tracking-[0.25em] text-neutral-400 font-extrabold uppercase border-b border-neutral-600/40 pb-1 mb-2">
                    SETLIST
                </h2>
                <div id="col-left" class="space-y-0.5"></div>
            </section>

            <!-- Imagen Central Trueno -->
            <div
                class="absolute inset-0 flex justify-center items-end pointer-events-none z-10 opacity-30 md:opacity-100">
                <img src="trueno_card.jpg" alt="Trueno Turrazo Tour"
                    class="h-[520px] md:h-[580px] object-cover object-center filter contrast-125">
            </div>

            <!-- Columna Derecha: 16 a 29 -->
            <section class="w-full md:w-[35%] z-20 space-y-1">
                <div class="hidden md:block h-6 mb-2 border-b border-transparent"></div>
                <div id="col-right" class="space-y-0.5"></div>
            </section>

        </div>

        <!-- Crédito inferior -->
        <footer
            class="text-center text-[10px] text-neutral-500 tracking-[0.2em] mt-8 border-t border-neutral-800/80 pt-3 relative z-20">
            @truenodata
        </footer>
    </main>

    <!-- Mini Reproductor Flotante en la parte inferior -->
    <div
        class="fixed bottom-4 inset-x-4 max-w-xl mx-auto bg-neutral-900/95 backdrop-blur-md border border-neutral-700/60 p-3 md:p-4 rounded-2xl shadow-2xl flex items-center justify-between z-50">
        <div class="flex items-center space-x-3 truncate">
            <div id="player-track-num"
                class="w-9 h-9 rounded-xl bg-neutral-800 flex items-center justify-center font-bold text-yellow-400 border border-neutral-700 text-sm shrink-0">
                4
            </div>
            <div class="truncate">
                <p id="player-track-title" class="text-sm font-bold text-white truncate">REAL GANGSTA LOVE</p>
                <p class="text-xs text-neutral-400 truncate">Trueno • Turr4zo World Tour</p>
            </div>
        </div>

        <!-- Controles con botón para escuchar en YouTube -->
        <div class="flex items-center space-x-2 shrink-0">
            <button id="btn-prev" class="p-2 text-neutral-400 hover:text-white transition" title="Anterior">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z" />
                </svg>
            </button>

            <!-- Botón de Reproducir que abre el tema seleccionado en YouTube -->
            <a id="btn-yt-play" href="https://www.youtube.com/watch?v=FCMtx6IRyYY" target="_blank"
                class="w-10 h-10 bg-yellow-400 hover:bg-yellow-300 text-black rounded-full flex items-center justify-center font-black transition active:scale-95"
                title="Reproducir en YouTube">
                ▶
            </a>

            <button id="btn-next" class="p-2 text-neutral-400 hover:text-white transition" title="Siguiente">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z" />
                </svg>
            </button>
        </div>
    </div>

    <script>
        // Las 29 canciones con sus enlaces directos oficiales de YouTube
        const songs = [
            { id: 1, title: "CON EL COMBO", yt: "https://www.youtube.com/watch?v=Ett9Opd_M6k" },
            { id: 2, title: "Atrevido", yt: "https://www.youtube.com/watch?v=VOehRh_gMc0" },
            { id: 3, title: "Bzrp Freestyle Sessions", yt: "https://www.youtube.com/watch?v=Cepdo2GOQZc" },
            { id: 4, title: "REAL GANGSTA LOVE", yt: "https://www.youtube.com/watch?v=FCMtx6IRyYY" },
            { id: 5, title: "1000 HORAS", yt: "https://www.youtube.com/results?search_query=Trueno+1000+Horas" },
            { id: 6, title: "Mamichula", yt: "https://www.youtube.com/watch?v=vkcmkw0-JTo" },
            { id: 7, title: "RAIN IV", yt: "https://www.youtube.com/watch?v=wW3S9qPXdjI" },
            { id: 8, title: "FEEL ME??", yt: "https://www.youtube.com/watch?v=Vk94xwl7HnA" },
            { id: 9, title: "GRILLZ", yt: "https://www.youtube.com/results?search_query=Trueno+GRILLZ" },
            { id: 10, title: "FRESH", yt: "https://www.youtube.com/results?search_query=Trueno+FRESH" },
            { id: 11, title: "90s", yt: "https://www.youtube.com/results?search_query=Trueno+90s" },
            { id: 12, title: "ESTILO SUDAKA", yt: "https://www.youtube.com/results?search_query=Trueno+ESTILO+SUDAKA" },
            { id: 13, title: "TRANKY FUNKY", yt: "https://www.youtube.com/watch?v=9lTY3JqpY9g" },
            { id: 14, title: "THE ROOF IS ON FIRE", yt: "https://www.youtube.com/watch?v=nbC073teGbY" },
            { id: 15, title: "PITY IN THE SKY", yt: "https://www.youtube.com/results?search_query=Trueno+PITY+IN+THE+SKY" },
            { id: 16, title: "ZOMBI", yt: "https://www.youtube.com/results?search_query=Trueno+ZOMBI" },
            { id: 17, title: "DELIVERY FREESTYLE", yt: "https://www.youtube.com/results?search_query=Trueno+DELIVERY+FREESTYLE" },
            { id: 18, title: "ARGENTINA", yt: "https://www.youtube.com/results?search_query=Trueno+ARGENTINA" },
            { id: 19, title: "PUMAS", yt: "https://www.youtube.com/results?search_query=Trueno+PUMAS" },
            { id: 20, title: "TIERRA ZANTA", yt: "https://www.youtube.com/results?search_query=Trueno+TIERRA+ZANTA" },
            { id: 21, title: "Azul y Oro", yt: "https://www.youtube.com/results?search_query=Trueno+Azul+y+Oro" },
            { id: 22, title: "URUGUAY", yt: "https://www.youtube.com/results?search_query=Trueno+URUGUAY" },
            { id: 23, title: "X UNAS LLANTAS", yt: "https://www.youtube.com/results?search_query=Trueno+X+UNAS+LLANTAS" },
            { id: 24, title: "Ñeri", yt: "https://www.youtube.com/results?search_query=Trueno+Neri" },
            { id: 25, title: "BAILANDO SOLA", yt: "https://www.youtube.com/results?search_query=Trueno+BAILANDO+SOLA" },
            { id: 26, title: "TURRAZO", yt: "https://www.youtube.com/watch?v=L2o7rdaWZY4" },
            { id: 27, title: "FUCK EL POLICE", yt: "https://www.youtube.com/results?search_query=Trueno+FUCK+EL+POLICE" },
            { id: 28, title: "VIOLENTO", yt: "https://www.youtube.com/results?search_query=Trueno+VIOLENTO" },
            { id: 29, title: "DANCE CRIP", yt: "https://www.youtube.com/watch?v=gjt-hgr1GMc" }
        ];

        let currentIndex = 3; // Inicia en REAL GANGSTA LOVE
        const trackTitle = document.getElementById("player-track-title");
        const trackNum = document.getElementById("player-track-num");
        const btnYtPlay = document.getElementById("btn-yt-play");

        function renderList() {
            const colLeft = document.getElementById("col-left");
            const colRight = document.getElementById("col-right");

            colLeft.innerHTML = "";
            colRight.innerHTML = "";

            songs.forEach((song, idx) => {
                const isCurrent = idx === currentIndex;
                const btn = document.createElement("button");
                btn.className = `w-full text-left py-1 px-2 rounded-lg flex items-center justify-between text-xs md:text-sm transition-all duration-200 ${isCurrent
                    ? "bg-yellow-400/20 text-yellow-300 font-bold translate-x-1 border-l-2 border-yellow-400"
                    : "text-neutral-300 hover:text-white hover:bg-neutral-800/40"
                    }`;

                btn.innerHTML = `
          <div class="flex items-center space-x-2 truncate">
            <span class="opacity-50 text-[11px] w-5 text-right font-mono">${song.id}.</span>
            <span class="truncate uppercase tracking-wide">${song.title}</span>
          </div>
          ${isCurrent ? `
            <div class="flex items-end h-3 ml-2 shrink-0">
              <span class="equalizer-bar"></span>
              <span class="equalizer-bar"></span>
              <span class="equalizer-bar"></span>
            </div>
          ` : ''}
        `;

                // Al hacer clic, selecciona la canción y actualiza el botón de YouTube
                btn.onclick = () => selectSong(idx);

                if (idx < 15) {
                    colLeft.appendChild(btn);
                } else {
                    colRight.appendChild(btn);
                }
            });
        }

        function selectSong(index) {
            currentIndex = index;
            const song = songs[currentIndex];
            trackTitle.textContent = song.title;
            trackNum.textContent = song.id;
            btnYtPlay.href = song.yt; // Actualiza el enlace directo de YouTube
            renderList();
        }

        document.getElementById("btn-prev").onclick = () => {
            const prev = (currentIndex - 1 + songs.length) % songs.length;
            selectSong(prev);
        };

        document.getElementById("btn-next").onclick = () => {
            const next = (currentIndex + 1) % songs.length;
            selectSong(next);
        };

        // Inicializar lista
        renderList();
    </script>
</body>

</html>
