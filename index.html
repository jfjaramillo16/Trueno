<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turr4zo World Tour for Xio</title>
    <!-- Tipografías urbanas oficiales -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <!-- Estilos directos garantizados para la dedicatoria -->
    <style>
        .dedication-wrapper {
            width: 100%;
            max-width: 900px;
            margin: 0 auto 24px auto;
            background: linear-gradient(135deg, rgba(35, 35, 35, 0.9) 0%, rgba(18, 18, 18, 0.95) 100%);
            border: 1px solid rgba(250, 204, 21, 0.35);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 18px 24px;
            text-align: center;
            backdrop-filter: blur(12px);
            position: relative;
            z-index: 30;
        }

        .dedication-badge {
            display: inline-block;
            background: #facc15;
            color: #000000;
            font-family: 'Inter', sans-serif;
            font-size: 0.68rem;
            font-weight: 900;
            letter-spacing: 0.18em;
            padding: 4px 12px;
            border-radius: 999px;
            text-transform: uppercase;
            margin-bottom: 8px;
            box-shadow: 0 2px 10px rgba(250, 204, 21, 0.3);
        }

        .dedication-title {
            font-family: 'Inter', sans-serif;
            font-size: clamp(1.2rem, 3.5vw, 1.55rem);
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.02em;
            margin: 0 0 6px 0;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        .dedication-text {
            font-family: 'Inter', sans-serif;
            font-size: clamp(0.82rem, 2vw, 0.92rem);
            color: #b3b3b3;
            line-height: 1.5;
            margin: 0;
            font-weight: 400;
        }

        .dedication-text strong {
            color: #facc15;
            font-weight: 700;
        }
    </style>
</head>

<body>

    <!-- Tarjeta de Dedicatoria para Xio -->
    <header class="dedication-wrapper">
        <span class="dedication-badge">TOUR READY</span>
        <h2 class="dedication-title">¡Bienvenida a tu primer concierto, Xio! ⚡</h2>
        <p class="dedication-text">
            Te preparé esta web para que te aprendas todo el setlist de <strong>Trueno</strong> de memoria y cantemos
            cada barra sin fallar.
        </p>
    </header>

    <!-- Contenedor Principal / Poster -->
    <main class="poster-card">

        <!-- Encabezado del Tour -->
        <header class="poster-header">
            <h1 class="poster-title">TRUENO</h1>
            <p class="poster-subtitle">TURR4ZO WORLD TOUR</p>
        </header>

        <!-- Cuerpo del Setlist -->
        <div class="setlist-container">

            <!-- Columna Izquierda (1-15) -->
            <section class="setlist-col left-col">
                <h2 class="col-heading">SETLIST</h2>
                <div id="col-left" class="track-list"></div>
            </section>

            <!-- Imagen Central de Trueno -->
            <div class="artist-stage">
                <img src="trueno_card.jpg" alt="Trueno" class="artist-image">
            </div>

            <!-- Columna Derecha (16-29) -->
            <section class="setlist-col right-col">
                <div class="heading-spacer"></div>
                <div id="col-right" class="track-list"></div>
            </section>

        </div>

        <!-- Pie del poster personalizado -->
        <footer class="poster-footer">
            <span>Hecho con flow para el primer concierto de Xio • @truenodata</span>
        </footer>
    </main>

    <!-- Barra Reproductor Flotante Inferior -->
    <div class="floating-player">
        <div class="player-info">
            <div id="track-number" class="badge">1</div>
            <div class="meta">
                <strong id="track-title">CON EL COMBO</strong>
                <small>Trueno • Para Xio</small>
            </div>
        </div>

        <!-- Controles -->
        <div class="player-controls">
            <button id="btn-prev" class="btn-ctrl" title="Anterior">⏮</button>
            <button id="btn-play" class="btn-play" title="Reproducir">▶</button>
            <button id="btn-next" class="btn-ctrl" title="Siguiente">⏭</button>
        </div>

        <!-- Barra de progreso -->
        <div class="progress-bar-wrapper">
            <div id="progress-bar" class="progress-bar"></div>
        </div>

        <!-- Elemento Audio Oculto -->
        <audio id="audio-player"></audio>
    </div>

    <script src="app.js"></script>
</body>

</html>
